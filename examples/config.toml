# ddlSaver configuration.
# Every ${VAR} is interpolated from the environment at load time; a missing
# variable is a fatal error. Validate with: ddl-saver validate -config <file>

[app]
name             = "ddlSaver"
log_level        = "info"     # debug | info | warn | error
log_format       = "text"     # text | json
graceful_timeout = "30s"
health_addr      = ":8080"    # /health/live and /health/ready; "" disables

[scheduler]
# Snapshot schedule (daemon mode only). Recovery is NEVER scheduled —
# it runs exclusively via `ddl-saver recover`.
spec         = "0 */6 * * *"
timezone     = "Europe/Moscow"
run_on_start = true
job_timeout  = "30m"   # upper bound for one pass over all clusters

[[clusters]]
name = "prod-analytics"

  [clusters.connection]
  scheme      = "native"
  compression = "lz4"
  endpoints   = [
    { host = "ch-1.prod.internal", port = 9000 },
    { host = "ch-2.prod.internal", port = 9000 },   # failover order = list order
  ]

  # TLS (secure native port 9440) with password auth:
  #   secure    = true                        # in [clusters.connection]; default port becomes 9440
  #   ca_file   = "/etc/ddl-saver/tls/ca.crt" # in [clusters.auth]; company root CA.
  #               Omit it if the CA is already in the system trust store.

  [clusters.auth]
  type     = "password"        # password | tls_certificate
  user     = "${CH_PROD_USER}"
  password = "${CH_PROD_PASSWORD}"
  # ca_file = "/etc/ddl-saver/tls/ca.crt"    # requires connection.secure = true
  # For tls_certificate (implies TLS):
  # cert_file = "/etc/ddl-saver/tls/client.crt"
  # key_file  = "/etc/ddl-saver/tls/client.key"
  # ca_file   = "/etc/ddl-saver/tls/ca.crt"

  [clusters.filter]
  skip_databases    = ["system", "information_schema", "INFORMATION_SCHEMA"]
  skip_tables_regex = ['^\.inner\.', '^tmp_', '_backup$']
  # Engine allow-list; an entry also admits its Replicated* variant.
  # Empty list = snapshot everything.
  include_engines   = [
    "MergeTree", "ReplacingMergeTree", "SummingMergeTree",
    "AggregatingMergeTree", "CollapsingMergeTree", "VersionedCollapsingMergeTree",
    "Distributed", "MaterializedView", "View", "Dictionary",
  ]

[gitlab]
url               = "https://gitlab.company.com"
token             = "${GITLAB_TOKEN}"        # needs api scope, write to repo
project_path      = "infra/clickhouse-schemas"
branch            = "main"
commit_author     = "DDL Saver Bot <ddl-saver@company.com>"
base_path         = "schemas"
dry_run           = false
# What happens to repo files whose objects disappeared from ClickHouse
# (dropped table, or every table of a dropped database):
#   keep      — leave the file in place, warn
#   deprecate — MOVE it to schemas/<cluster>/_deprecated/<db>/<kind>/ and
#               record `since` in manifest.json; if the object reappears,
#               the archived copy is removed automatically  (default)
#   prune     — delete the file (git history still has it)
on_deleted        = "deprecate"
commit_batch_size = 100

[recovery]
create_strategy       = "if_not_exists"  # locked; validation rejects anything else
defer_invalid_objects = true   # false = refuse to run partial plans
# Interactive [y/N] before apply. Defaults to TRUE, including when this key
# is absent — only an explicit `false` disables the prompt.
require_confirmation  = true
retries               = 3
retry_backoff         = "2s"
