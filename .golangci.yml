version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - errorlint      # errors.Is/As instead of == / type assertions
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gocritic
    - revive
    - unconvert
    - prealloc
    - nilerr
    - copyloopvar    # flags now-redundant `x := x` (Go 1.22 loop semantics)
    - testifylint    # no-op here (stdlib tests), harmless if testify ever appears
  settings:
    revive:
      rules:
        - name: exported
          disabled: true   # doc comments enforced by review, not lint
    gocritic:
      enabled-tags: [diagnostic, style]
      disabled-checks: [hugeParam]   # config structs are passed by value on purpose
  exclusions:
    rules:
      - path: _test\.go
        linters: [prealloc, gocritic]

formatters:
  enable: [gofmt, gofumpt]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
